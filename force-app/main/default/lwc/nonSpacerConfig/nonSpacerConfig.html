<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container" style="max-width:95%;width:95%;">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium">NON-SPACER DESIGN DETAILS</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium" style="min-height:55vh;">

                <!-- General Details -->
                <div class="slds-box slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_medium">General Details - Non-Spacer Design</h3>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox label="NON-SPACER DESIGN" value={designType} options={designOptions} onchange={handleDesignChange}></lightning-combobox>
                        </div>
                    </div>
                </div>

                <!-- ═══════════════ W-BEAM ═══════════════ -->
                <template lwc:if={isWBeam}>
                    <div class="slds-box slds-m-bottom_medium" style="border-left:4px solid #0070d2;">
                        <h3 class="slds-text-heading_small slds-m-bottom_small" style="color:#0070d2;">W - Beam Type (Non-Spacer Design)</h3>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Beam Thickness (Black mm)" value={w.beamThickness} options={wBeamOptions} data-field="beamThickness" onchange={handleWChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Centre To Centre" value={w.centreTocentre} options={wCtcOptions} data-field="centreTocentre" onchange={handleWChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Post Thickness (Black mm)" value={w.postThickness} options={wPostThicknessOptions} data-field="postThickness" onchange={handleWChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Post Height" value={w.postHeight} data-field="postHeight" onchange={handleWChange}></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="text" label="Nuts &amp; Bolts" value={w.nutsBolts} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Zinc Coating" value={w.zincCoating} options={zincOptions} data-field="zincCoating" onchange={handleWChange}></lightning-combobox></div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Quantity (RM)" value={w.quantityRm} data-field="quantityRm" onchange={handleWChange}></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Trans. in offer?" value={w.transInOffer} options={transOptions} data-field="transInOffer" onchange={handleWChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Transportation (Kg)" value={w.transportation} data-field="transportation" disabled={wIsExWorks} onchange={handleWChange}></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Margin (%)" value={w.margin} data-field="margin" onchange={handleWChange}></lightning-input></div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small" style="background:#f0f5ff;padding:8px;border-radius:4px;">
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Total Wt (Kg/Mtr)" value={w.totalWt} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Rate/RM (₹)" value={w.rateRm} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Unit Price (₹)" value={w.unitPrice} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Unit Cost (₹)" value={w.unitCost} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="List Price (₹)" value={w.listPrice} read-only></lightning-input></div>
                        </div>
                    </div>
                </template>

                <!-- ═══════════════ THRIE-BEAM ═══════════════ -->
                <template lwc:if={isThrieBeam}>
                    <div class="slds-box slds-m-bottom_medium" style="border-left:4px solid #2e844a;">
                        <h3 class="slds-text-heading_small slds-m-bottom_small" style="color:#2e844a;">T - Thrie Beam (European Design)</h3>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Beam Thickness (Black mm)" value={t.beamThickness} options={tBeamOptions} data-field="beamThickness" onchange={handleTChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Centre To Centre" value={t.centreTocentre} options={tCtcOptions} data-field="centreTocentre" onchange={handleTChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Post Thickness (Black mm)" value={t.postThickness} options={tPostThicknessOptions} data-field="postThickness" onchange={handleTChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Post Height" value={t.postHeight} data-field="postHeight" onchange={handleTChange}></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="text" label="Nuts &amp; Bolts" value={t.nutsBolts} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Zinc Coating" value={t.zincCoating} options={zincOptions} data-field="zincCoating" onchange={handleTChange}></lightning-combobox></div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Quantity (RM)" value={t.quantityRm} data-field="quantityRm" onchange={handleTChange}></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-combobox label="Trans. in offer?" value={t.transInOffer} options={transOptions} data-field="transInOffer" onchange={handleTChange}></lightning-combobox></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Transportation (Kg)" value={t.transportation} data-field="transportation" disabled={tIsExWorks} onchange={handleTChange}></lightning-input></div>
                            <div class="slds-col slds-size_1-of-6"><lightning-input type="number" label="Margin (%)" value={t.margin} data-field="margin" onchange={handleTChange}></lightning-input></div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small" style="background:#f0fff4;padding:8px;border-radius:4px;">
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Total Wt (Kg/Mtr)" value={t.totalWt} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Rate/RM (₹)" value={t.rateRm} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Unit Price (₹)" value={t.unitPrice} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="Unit Cost (₹)" value={t.unitCost} read-only></lightning-input></div>
                            <div class="slds-col slds-size_1-of-4"><lightning-input type="number" label="List Price (₹)" value={t.listPrice} read-only></lightning-input></div>
                        </div>
                    </div>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleClose}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSave}>Save Configuration</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
