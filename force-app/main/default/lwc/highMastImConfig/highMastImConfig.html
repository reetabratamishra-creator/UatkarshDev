<template>
    <template if:true={isLoading}>
        <div class="im-loading">
            <div class="im-load-card">
                <div class="im-load-text" role="status" aria-live="polite">{loadText}</div>
                <div class="im-progress"><div class="im-progress-bar" style={loadBarStyle}></div></div>
            </div>
        </div>
    </template>
    <template if:true={loadError}><div class="im-alert">{loadError}</div></template>

    <template if:false={isLoading}>
        <!-- HIGH MAST CROSS PRODUCT: one chip per product on the quote (number + type / sub-type).
             Click = bring that product on screen; x = remove (asks first); + Add product = a new
             empty product. Read-only quotes show the chips without x / add. -->
        <template if:true={hmShowStrip}>
            <div class="im-typebar hm-strip">
                <span class="im-typebar-cap">PRODUCTS ON THIS QUOTE <span class="hm-count">{hmProductCountLabel}</span></span>
                <template for:each={hmProductChips} for:item="c">
                    <span key={c.key} class="hm-chip-wrap">
                        <button type="button" class={c.cls} data-idx={c.idx} onclick={handleHmSelectProduct} title="Show this product">
                            <span class="hm-chip-no">{c.no}</span>{c.label}
                            <template if:true={c.hasTrigger}><span class="im-typechip-dot">APPROVAL</span></template>
                        </button>
                        <template if:true={c.canRemove}>
                            <template if:true={c.confirming}>
                                <span class="hm-confirm">Remove?
                                    <button type="button" class="hm-mini hm-mini-yes" data-idx={c.idx} onclick={handleHmRemoveConfirm}>Yes</button>
                                    <button type="button" class="hm-mini" onclick={handleHmRemoveCancel}>No</button>
                                </span>
                            </template>
                            <template if:false={c.confirming}>
                                <button type="button" class="hm-x" data-idx={c.idx} onclick={handleHmRemoveAsk} title="Remove this product">&times;</button>
                            </template>
                        </template>
                    </span>
                </template>
                <template if:true={hmCanAdd}>
                    <button type="button" class="im-typechip hm-add" onclick={handleHmAddProduct} title="Add another product to this quote">+ Add product</button>
                </template>
            </div>
        </template>
        <template if:true={crossNote}><div class="im-note im-note_err">{crossNote}</div></template>
        <template if:true={rateSourceNote}><div class={rateSourceCls}>{rateSourceNote}</div></template>
        <template if:true={hasErrorPanel}>
            <div class="im-note im-note_err im-errlist">
                <div class="im-errlist-title">Please correct the following before applying:</div>
                <template for:each={errorPanelItems} for:item="e"><div key={e.key} class="im-errlist-item">{e.text}</div></template>
            </div>
        </template>

        <template for:each={accordions} for:item="acc">
            <template if:true={acc.visible}>
                <section key={acc.key} class="im-acc">
                    <button type="button" class="im-acc-head" data-key={acc.key} data-open={acc.expanded} onclick={toggle}>
                        <lightning-icon icon-name={acc.chev} size="x-small" class="im-chev"></lightning-icon>
                        <span class="im-no">{acc.no}</span><span class="im-acc-title">{acc.label}</span>
                    </button>

                    <template if:true={acc.expanded}>
                        <div class="im-acc-body">
                            <template if:true={acc.inline.length}>
                            <div class="im-grid">
                                <template for:each={acc.inline} for:item="f">
                                    <div key={f.key} class={f.cls} style={f.spanStyle}>
                                        <template if:true={f.isSectionHeader}><div class="im-header">{f.label}</div></template>
                                        <template if:false={f.isHeader}>
                                            <template if:true={f.isCheckbox}>
                                                <label class="im-checkline"><input type="checkbox" class="im-checkbox" data-api={f.apiName} checked={f.checked} disabled={f.readOnly} onchange={handleInput} /><span>{f.label}</span></label>
                                            </template>
                                            <template if:false={f.isCheckbox}>
                                                <template if:true={f.hasLabel}><label class="im-label"><span class="im-no im-no_sm">{f.no}</span>{f.label}<template if:true={f.required}><span class="im-req">*</span></template></label></template>
                                                <template if:true={f.isReadOnlyValue}>
                                                    <div class={f.valueCls}><span class="im-value-num">{f.display}</span><template if:true={f.unit}><span class="im-value-unit">{f.unit}</span></template></div>
                                                </template>
                                                <template if:false={f.isReadOnlyValue}>
                                                    <template if:true={f.isPicklist}>
                                                        <select class={f.selectCls} data-api={f.apiName} data-required={f.reqAttr} onchange={handleInput}>
                                                            <option value="">Select…</option>
                                                            <template for:each={f.options} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                                                        </select>
                                                    </template>
                                                    <template if:true={f.isNumber}>
                                                        <input type="number" inputmode="decimal" step="any" onwheel={handleWheel} class={f.inputCls} data-api={f.apiName} data-required={f.reqAttr} value={f.value} min={f.min} onchange={handleInput} />
                                                    </template>
                                                    <template if:true={f.isText}>
                                                        <input type="text" class={f.inputCls} data-api={f.apiName} data-required={f.reqAttr} value={f.value} onchange={handleInput} />
                                                    </template>
                                                    <template if:true={f.isTextarea}>
                                                        <textarea class={f.inputCls} data-api={f.apiName} data-required={f.reqAttr} rows="2" onchange={handleInput}></textarea>
                                                    </template>
                                                </template>
                                                <template if:true={f.err}><div class="im-err">{f.err}</div></template>
                                            </template>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            </template>

                            <template for:each={acc.folders} for:item="folder">
                                <div key={folder.key} class={folder.folderCls}>
                                    <button type="button" class="im-folder-head" data-key={folder.key} data-open={folder.expanded} onclick={toggle}>
                                        <lightning-icon icon-name={folder.chev} size="xx-small" class="im-chev"></lightning-icon>
                                        <span class="im-no im-no_sm">{folder.no}</span><span class="im-folder-title">{folder.label}</span>
                                        <template if:true={folder.isTrigger}><span class="im-trigger-tag">APPROVAL TRIGGER</span></template>
                                    </button>
                                    <!-- the estimator stays mounted while its folder is folded (values, lines and
                                         validation keep working); only the card body is hidden -->
                                    <div class={folder.bodyCls}>
                                        <template if:true={folder.hint}><div class="im-note im-note_warn im-folder-hint">{folder.hint}</div></template>
                                        <template if:true={folder.statusText}><div class="im-note im-note_err">{folder.statusText}</div></template>
                                        <template if:false={folder.hint}>
                                            <c-high-mast-im-estimator data-folder={folder.key} inline folder-key={folder.key}
                                                is-read-only={isReadOnly} currency-code={currencyCode} exchange-rate={exchangeRate}
                                                onimlive={handleImLive}></c-high-mast-im-estimator>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </section>
            </template>
        </template>
    </template>
</template>
