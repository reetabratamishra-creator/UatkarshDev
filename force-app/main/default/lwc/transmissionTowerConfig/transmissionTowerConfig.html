<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container" style="max-width: 95%; width: 95%;">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                </button>
                <h2 class="slds-text-heading_medium slds-hyphenate">{modalTitle}</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium" style="min-height: 50vh;">
                <template if:false={hasEstimatorType}>
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium slds-p-around_small slds-box slds-theme_default">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            name="estimatorType"
                            label="Type of Tower"
                            value={selectedType}
                            options={typeOptions}
                            onchange={handleTypeChange}
                            required>
                        </lightning-combobox>
                    </div>
                </div>
                </template>

      <lightning-combobox label="FORMULA" value={pv_formula} options={pv_formula_options} data-field="pv_formula" onchange={handleFieldChange}  ></lightning-combobox>
    </div>
  <template if:true={is_pv_base_month_visible}>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
      <lightning-combobox label="BASE MONTH" value={pv_base_month} options={pv_base_month_options} data-field="pv_base_month" onchange={handleFieldChange}  ></lightning-combobox>
    </div>
  </template>
  <template if:true={is_pv_base_year_visible}>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
      <lightning-combobox label="BASE MONTH" value={pv_base_year} options={pv_base_year_options} data-field="pv_base_year" onchange={handleFieldChange}  ></lightning-combobox>
    </div>
  </template>
  <template if:true={is_pv_blooms_visible}>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
      <lightning-input type="number" label="BLOOMS" value={pv_blooms} data-field="pv_blooms" onchange={handleFieldChange}  disabled step="0.01"></lightning-input>
    </div>
  </template>
  <template if:true={is_pv_billets_visible}>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
      <lightning-input type="number" label="BILLETS" value={pv_billets} data-field="pv_billets" onchange={handleFieldChange}  disabled step="0.01"></lightning-input>
    </div>
  </template>
  <template if:true={is_pv_zinc_visible}>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
      <lightning-input type="number" label="ZINC" value={pv_zinc} data-field="pv_zinc" onchange={handleFieldChange}  disabled step="0.01"></lightning-input>
    </div>
  </template>
  <template if:true={is_pv_consumer_price_index_visible}>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
      <lightning-input type="number" label="CONSUMER PRICE INDEX" value={pv_consumer_price_index} data-field="pv_consumer_price_index" onchange={handleFieldChange}  disabled step="0.01"></lightning-input>
    </div>
  </template>
</div></div>
</template>

            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleClose}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSave}>Save Configuration</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
