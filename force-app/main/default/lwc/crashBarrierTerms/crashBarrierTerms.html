<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container" style="max-width:80%;width:80%;">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium">TERMS &amp; CONDITIONS</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium" style="min-height:40vh; background:#f4f6f9;">
                
                <div class="slds-box slds-m-bottom_medium" style="border-left:4px solid #2e844a; background:white;">
                    <h3 class="slds-text-heading_small slds-m-bottom_small" style="color:#2e844a; font-weight:bold;">Terms &amp; Condition Details</h3>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                            <lightning-input type="number" label="Validity (days)" value={terms.tc_validity_days} data-field="tc_validity_days" onchange={handleChange}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-4 slds-m-bottom_small">
                            <lightning-textarea label="Special Note" value={terms.tc_special_note} data-field="tc_special_note" onchange={handleChange}></lightning-textarea>
                        </div>
                    </div>
                </div>

                <div class="slds-box" style="border-left:4px solid #bf7326; background:white;">
                    <h3 class="slds-text-heading_small slds-m-bottom_small" style="color:#bf7326; font-weight:bold;">Payment Terms</h3>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <lightning-combobox label="PAYMENT TERMS" value={terms.tc_payment_terms_picklist} options={paymentTermsOptions} data-field="tc_payment_terms_picklist" onchange={handleChange}></lightning-combobox>
                        </div>
                        
                        <template lwc:if={showInterestFreeCredit}>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-combobox label="No. of days Interest free credit" value={terms.tc_no_of_days_interest_free_credit} options={interestFreeOptions} data-field="tc_no_of_days_interest_free_credit" onchange={handleChange}></lightning-combobox>
                            </div>
                        </template>

                        <template lwc:if={showUsancePeriod}>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" label="Usance Period (Days)" value={terms.tc_usance_period} data-field="tc_usance_period" onchange={handleChange}></lightning-input>
                            </div>
                        </template>
                    </div>
                </div>

            </div>

            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleCancel}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSave}>Save</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
