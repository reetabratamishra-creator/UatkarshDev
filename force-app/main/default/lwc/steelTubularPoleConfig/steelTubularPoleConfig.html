        <div class="slds-modal__container" style="max-width: 95%; width: 95%;">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                </button>
                <h2 class="slds-text-heading_medium slds-hyphenate">Steel Tubular Pole Estimator</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium" style="min-height: 50vh;">
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium slds-p-around_small slds-box slds-theme_default">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            name="estimatorType"
                            label="Type of Pole"
                            value={selectedType}
                            options={typeOptions}
                            onchange={handleTypeChange}
                            required>
                        </lightning-combobox>

                </div>
